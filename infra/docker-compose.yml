services:
  postgres:
    image: postgres:16
    container_name: mepn-postgres
    environment:
      POSTGRES_DB: mepn
      POSTGRES_USER: mepn
      POSTGRES_PASSWORD: mepn
    ports:
      - "5432:5432"
    volumes:
      - mepn-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mepn-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: mepn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mepn
      MINIO_ROOT_PASSWORD: mepn_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mepn-minio-data:/data

volumes:
  mepn-postgres-data:
  mepn-minio-data:

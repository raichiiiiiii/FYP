services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: mepn_local_frontend
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: mepn_local_api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      API_PORT: 3000
      WEB_ORIGIN: ${LOCAL_WEB_ORIGIN:-http://localhost:5173}
      WEB_ORIGINS: ${LOCAL_WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mepn:mepn@postgres:5432/mepn}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-local_demo_jwt_secret}
      SESSION_SECRET: ${SESSION_SECRET:-local_demo_session_secret}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_TEST_MODE: ${OIDC_TEST_MODE:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-mepn-documents}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mepn}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mepn_password}
      BLOCKCHAIN_ANCHOR_ADAPTER: ${LOCAL_BLOCKCHAIN_ANCHOR_ADAPTER:-mock}
      FABRIC_ENABLED: ${LOCAL_FABRIC_ENABLED:-false}
      FABRIC_MODE: ${LOCAL_FABRIC_MODE:-mock}
      FABRIC_GATEWAY_URL: ${LOCAL_FABRIC_GATEWAY_URL:-}
      FABRIC_MSP_ID: ${LOCAL_FABRIC_MSP_ID:-}
      FABRIC_IDENTITY: ${LOCAL_FABRIC_IDENTITY:-}
      FABRIC_CHANNEL: ${LOCAL_FABRIC_CHANNEL:-}
      FABRIC_CHAINCODE: ${LOCAL_FABRIC_CHAINCODE:-}
      FABRIC_IDENTITY_CERT_PATH: /run/secrets/fabric/client.crt
      FABRIC_PRIVATE_KEY_PATH: /run/secrets/fabric/client.key
      FABRIC_TLS_CERT_PATH: /run/secrets/fabric/ca.crt
      FABRIC_PEER_ENDPOINT: ${LOCAL_FABRIC_PEER_ENDPOINT:-}
      FABRIC_GATEWAY_HOST_ALIAS: ${LOCAL_FABRIC_GATEWAY_HOST_ALIAS:-}
      FABRIC_SUBMIT_TIMEOUT_MS: ${LOCAL_FABRIC_SUBMIT_TIMEOUT_MS:-30000}
      FABRIC_COMMIT_TIMEOUT_MS: ${LOCAL_FABRIC_COMMIT_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ${FABRIC_SECRET_MOUNT:-./deploy/fabric}:/run/secrets/fabric:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    container_name: mepn_local_worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mepn:mepn@postgres:5432/mepn}
      WORKER_POLL_ENABLED: ${WORKER_POLL_ENABLED:-true}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      BLOCKCHAIN_ANCHOR_ADAPTER: ${LOCAL_BLOCKCHAIN_ANCHOR_ADAPTER:-mock}
      FABRIC_ENABLED: ${LOCAL_FABRIC_ENABLED:-false}
      FABRIC_MODE: ${LOCAL_FABRIC_MODE:-mock}
      FABRIC_GATEWAY_URL: ${LOCAL_FABRIC_GATEWAY_URL:-}
      FABRIC_MSP_ID: ${LOCAL_FABRIC_MSP_ID:-}
      FABRIC_IDENTITY: ${LOCAL_FABRIC_IDENTITY:-}
      FABRIC_CHANNEL: ${LOCAL_FABRIC_CHANNEL:-}
      FABRIC_CHAINCODE: ${LOCAL_FABRIC_CHAINCODE:-}
      FABRIC_IDENTITY_CERT_PATH: /run/secrets/fabric/client.crt
      FABRIC_PRIVATE_KEY_PATH: /run/secrets/fabric/client.key
      FABRIC_TLS_CERT_PATH: /run/secrets/fabric/ca.crt
      FABRIC_PEER_ENDPOINT: ${LOCAL_FABRIC_PEER_ENDPOINT:-}
      FABRIC_GATEWAY_HOST_ALIAS: ${LOCAL_FABRIC_GATEWAY_HOST_ALIAS:-}
      FABRIC_SUBMIT_TIMEOUT_MS: ${LOCAL_FABRIC_SUBMIT_TIMEOUT_MS:-30000}
      FABRIC_COMMIT_TIMEOUT_MS: ${LOCAL_FABRIC_COMMIT_TIMEOUT_MS:-30000}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${FABRIC_SECRET_MOUNT:-./deploy/fabric}:/run/secrets/fabric:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mepn_local_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mepn}
      POSTGRES_USER: ${POSTGRES_USER:-mepn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mepn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mepn_local_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mepn_local_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-mepn}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-mepn_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - local_minio_data:/data
    restart: unless-stopped

volumes:
  local_postgres_data:
  local_redis_data:
  local_minio_data:

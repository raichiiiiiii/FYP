services:
  reverse-proxy:
    image: nginx:alpine
    container_name: mepn_reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: mepn_frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    container_name: mepn_api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mepn:change_me@postgres:5432/mepn}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      SESSION_SECRET: ${SESSION_SECRET:-change_me}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-mepn-documents}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change_me}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_MODE: ${FABRIC_MODE:-mock}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-}
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-}
      FABRIC_IDENTITY_CERT_PATH: ${FABRIC_IDENTITY_CERT_PATH:-}
      FABRIC_PRIVATE_KEY_PATH: ${FABRIC_PRIVATE_KEY_PATH:-}
      FABRIC_TLS_CERT_PATH: ${FABRIC_TLS_CERT_PATH:-}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-}
      FABRIC_GATEWAY_HOST_ALIAS: ${FABRIC_GATEWAY_HOST_ALIAS:-}
      FABRIC_SUBMIT_TIMEOUT_MS: ${FABRIC_SUBMIT_TIMEOUT_MS:-30000}
      FABRIC_COMMIT_TIMEOUT_MS: ${FABRIC_COMMIT_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    container_name: mepn_worker
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mepn:change_me@postgres:5432/mepn}
      WORKER_POLL_ENABLED: ${WORKER_POLL_ENABLED:-true}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_MODE: ${FABRIC_MODE:-mock}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-}
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-}
      FABRIC_IDENTITY_CERT_PATH: ${FABRIC_IDENTITY_CERT_PATH:-}
      FABRIC_PRIVATE_KEY_PATH: ${FABRIC_PRIVATE_KEY_PATH:-}
      FABRIC_TLS_CERT_PATH: ${FABRIC_TLS_CERT_PATH:-}
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-}
      FABRIC_GATEWAY_HOST_ALIAS: ${FABRIC_GATEWAY_HOST_ALIAS:-}
      FABRIC_SUBMIT_TIMEOUT_MS: ${FABRIC_SUBMIT_TIMEOUT_MS:-30000}
      FABRIC_COMMIT_TIMEOUT_MS: ${FABRIC_COMMIT_TIMEOUT_MS:-30000}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mepn_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mepn}
      POSTGRES_USER: ${POSTGRES_USER:-mepn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mepn_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mepn_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-change_me}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change_me}
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

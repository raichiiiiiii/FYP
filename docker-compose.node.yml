services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "${WEB_HOST_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    ports:
      - "${API_HOST_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      LOCAL_PASSWORD_AUTH_ENABLED: ${LOCAL_PASSWORD_AUTH_ENABLED:-true}
      API_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN}
      WEB_ORIGINS: ${WEB_ORIGINS}
      LOCAL_WEB_ORIGIN: ${WEB_ORIGIN}
      LOCAL_WEB_ORIGINS: ${WEB_ORIGINS}
      MEPN_NODE_KEY: ${MEPN_NODE_KEY}
      MEPN_NODE_ORG_NAME: ${MEPN_NODE_ORG_NAME}
      MEPN_NODE_ORG_TYPE: ${MEPN_NODE_ORG_TYPE}
      MEPN_NODE_PUBLIC_WEB_URL: ${MEPN_NODE_PUBLIC_WEB_URL}
      MEPN_NODE_PUBLIC_API_URL: ${MEPN_NODE_PUBLIC_API_URL}
      MEPN_SINGLE_ORG_NODE: ${MEPN_SINGLE_ORG_NODE:-true}
      NODE_FEDERATION_SHARED_SECRET: ${NODE_FEDERATION_SHARED_SECRET:-local-demo-federation-only}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-demo-jwt-only}
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-session-only}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_TEST_MODE: ${OIDC_TEST_MODE:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-mepn-documents}
      MINIO_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-mepn}
      MINIO_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-mepn_password}
      BLOCKCHAIN_ANCHOR_ADAPTER: ${BLOCKCHAIN_ANCHOR_ADAPTER:-mock}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_MODE: ${FABRIC_MODE:-mock}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-}
      FABRIC_IDENTITY: ${FABRIC_IDENTITY:-}
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-}
      FABRIC_IDENTITY_CERT_PATH: /run/secrets/fabric/client.crt
      FABRIC_PRIVATE_KEY_PATH: /run/secrets/fabric/client.key
      FABRIC_TLS_CERT_PATH: /run/secrets/fabric/ca.crt
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-}
      FABRIC_GATEWAY_HOST_ALIAS: ${FABRIC_GATEWAY_HOST_ALIAS:-}
      FABRIC_SUBMIT_TIMEOUT_MS: ${FABRIC_SUBMIT_TIMEOUT_MS:-30000}
      FABRIC_COMMIT_TIMEOUT_MS: ${FABRIC_COMMIT_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ${FABRIC_SECRET_MOUNT:-./deploy/fabric}:/run/secrets/fabric:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MEPN_NODE_KEY: ${MEPN_NODE_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WORKER_POLL_ENABLED: ${WORKER_POLL_ENABLED:-true}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      BLOCKCHAIN_ANCHOR_ADAPTER: ${BLOCKCHAIN_ANCHOR_ADAPTER:-mock}
      FABRIC_ENABLED: ${FABRIC_ENABLED:-false}
      FABRIC_MODE: ${FABRIC_MODE:-mock}
      FABRIC_GATEWAY_URL: ${FABRIC_GATEWAY_URL:-}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-}
      FABRIC_IDENTITY: ${FABRIC_IDENTITY:-}
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-}
      FABRIC_IDENTITY_CERT_PATH: /run/secrets/fabric/client.crt
      FABRIC_PRIVATE_KEY_PATH: /run/secrets/fabric/client.key
      FABRIC_TLS_CERT_PATH: /run/secrets/fabric/ca.crt
      FABRIC_PEER_ENDPOINT: ${FABRIC_PEER_ENDPOINT:-}
      FABRIC_GATEWAY_HOST_ALIAS: ${FABRIC_GATEWAY_HOST_ALIAS:-}
      FABRIC_SUBMIT_TIMEOUT_MS: ${FABRIC_SUBMIT_TIMEOUT_MS:-30000}
      FABRIC_COMMIT_TIMEOUT_MS: ${FABRIC_COMMIT_TIMEOUT_MS:-30000}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${FABRIC_SECRET_MOUNT:-./deploy/fabric}:/run/secrets/fabric:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mepn}
      POSTGRES_USER: ${POSTGRES_USER:-mepn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mepn}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-mepn}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-mepn_password}
    ports:
      - "${MINIO_API_HOST_PORT}:9000"
      - "${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
